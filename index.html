<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat & Image Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chat-box { height: 450px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        .message { margin-bottom: 15px; line-height: 1.5; padding: 10px; border-radius: 8px; }
        .user-msg { background-color: #e3f2fd; border-left: 4px solid #1976d2; }
        .ai-msg { background-color: #f5f5f5; border-left: 4px solid #4caf50; }
        .system-msg { background-color: #ffebee; border-left: 4px solid #f44336; font-size: 0.9em; }
        img.generated-image { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .api-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex-grow: 1; margin-bottom: 0; }
        button { padding: 10px 15px; border: none; background: #1976d2; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1565c0; }
        button.img-btn { background: #9c27b0; }
        button.img-btn:hover { background: #7b1fa2; }
        .loader { display: none; font-style: italic; color: #666; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Assistant 🤖</h2>
    
    <div class="api-section">
        <label for="apiKey"><strong>OpenRouter API Key:</strong> (Required for chat)</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" />
        <small style="color: #666;">Images don't require an API key (powered by Pollinations.ai).</small>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg"><strong>System:</strong> Hello! Enter your OpenRouter API key above to chat, or just type a prompt and click "Generate Image".</div>
    </div>
    <div class="loader" id="loader">AI is typing...</div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Type a message or describe an image..." onkeypress="handleEnter(event)" />
        <button onclick="sendMessage()">Send Chat</button>
        <button class="img-btn" onclick="generateImage()">🎨 Generate Image</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const apiKeyInput = document.getElementById('apiKey');
    const loader = document.getElementById('loader');

    let chatHistory = [];

    // Helper to add messages to the UI
    function appendMessage(role, content, isHtml = false) {
        const div = document.createElement('div');
        div.className = `message ${role}-msg`;
        const prefix = role === 'user' ? 'You: ' : (role === 'ai' ? 'AI: ' : '');
        
        if (isHtml) {
            div.innerHTML = `<strong>${prefix}</strong>${content}`;
        } else {
            div.innerHTML = `<strong>${prefix}</strong><span class="content"></span>`;
            div.querySelector('.content').textContent = content;
        }
        
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div.querySelector('.content') || div; 
    }

    // Handle Enter key for chat
    function handleEnter(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    // Function to stream chat from OpenRouter
    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;
        if (!apiKey) {
            alert('Please enter your OpenRouter API key first.');
            return;
        }

        appendMessage('user', text);
        userInput.value = '';
        loader.style.display = 'block';

        chatHistory.push({ role: "user", content: text });
        
        // Create a placeholder span for the AI's streaming response
        const aiMessageNode = appendMessage('ai', '');

        try {
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': window.location.href,
                    'X-Title': 'Local HTML Chatbot',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'google/gemini-2.5-flash', // You can change the model here
                    messages: chatHistory,
                    stream: true
                })
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(`API Error: ${response.status} - ${err}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let aiFullResponse = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.substring(6));
                            const content = data.choices[0]?.delta?.content || "";
                            aiFullResponse += content;
                            aiMessageNode.textContent = aiFullResponse; // Stream update
                            chatBox.scrollTop = chatBox.scrollHeight;
                        } catch (e) {
                            console.error("Error parsing stream chunk", e);
                        }
                    }
                }
            }
            
            // Save the AI's full response to history for context in the next message
            chatHistory.push({ role: "assistant", content: aiFullResponse });

        } catch (error) {
            appendMessage('system', `Error: ${error.message}`);
        } finally {
            loader.style.display = 'none';
        }
    }

    // Function to generate an image using Pollinations.ai (No API key needed)
    function generateImage() {
        const prompt = userInput.value.trim();
        if (!prompt) {
            alert('Please enter a description for the image.');
            return;
        }

        appendMessage('user', `(Generate Image) ${prompt}`);
        userInput.value = '';
        
        // Encode prompt for the URL
        const encodedPrompt = encodeURIComponent(prompt);
        // Add random seed to avoid caching the same image for the same prompt
        const randomSeed = Math.floor(Math.random() * 100000);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${randomSeed}`;
        
        const imageHtml = `<br><img src="${imageUrl}" class="generated-image" alt="${prompt}" onload="chatBox.scrollTop = chatBox.scrollHeight" />`;
        
        appendMessage('ai', `Here is your generated image for: "${prompt}" <br>${imageHtml}`, true);
    }
</script>

</body>
</html>
