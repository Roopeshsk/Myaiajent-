<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAI - The Future of Intelligence</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00f3ff',
                        neonPurple: '#bc13fe',
                        darkBg: '#050505',
                        glassPanel: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        .glass-effect {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .text-gradient {
            background: linear-gradient(to right, #00f3ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-animated-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(188,19,254,0.15) 0%, rgba(0,243,255,0.05) 50%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        
        .bg-animated-glow-2 {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, rgba(188,19,254,0.05) 50%, rgba(0,0,0,0) 70%);
            bottom: -300px;
            right: -200px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const SidebarItem = ({ icon, text, active }) => (
            <div className={`flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-all duration-200 ${active ? 'bg-gradient-to-r from-white/10 to-transparent border-l-2 border-neonBlue text-white' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                <i className={`fa-solid ${icon} w-5 text-center ${active ? 'text-neonBlue' : ''}`}></i>
                <span className="text-sm font-medium">{text}</span>
            </div>
        );

        const ControlToggle = ({ label }) => {
            const [on, setOn] = useState(false);
            return (
                <div className="flex justify-between items-center py-2">
                    <span className="text-sm text-gray-300">{label}</span>
                    <div onClick={() => setOn(!on)} className={`w-10 h-5 rounded-full p-1 cursor-pointer transition-colors duration-300 ${on ? 'bg-neonPurple' : 'bg-gray-700'}`}>
                        <div className={`w-3.5 h-3.5 bg-white rounded-full transition-transform duration-300 ${on ? 'translate-x-4.5' : ''}`}></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [messages, setMessages] = useState([
                { role: 'assistant', text: 'Welcome to OmniAI. System online. All modules initialized. How can I assist you today?' }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSend = () => {
                if (!input.trim()) return;
                
                const newMessages = [...messages, { role: 'user', text: input }];
                setMessages(newMessages);
                setInput('');
                setIsTyping(true);

                // Simulate AI response
                setTimeout(() => {
                    setIsTyping(false);
                    setMessages([...newMessages, { role: 'assistant', text: `I have processed your request regarding "${input.substring(0, 20)}...". As an advanced multi-model intelligence, I've analyzed this across 4 knowledge bases. Is there a specific parameter you'd like me to adjust?` }]);
                }, 1500);
            };

            return (
                <div className="flex h-screen w-full relative bg-darkBg overflow-hidden">
                    {/* Background Glows */}
                    <div className="bg-animated-glow animate-pulse-slow"></div>
                    <div className="bg-animated-glow-2 animate-pulse-slow" style={{ animationDelay: '2s' }}></div>

                    {/* LEFT SIDEBAR */}
                    <div className="w-64 h-full glass-effect z-10 flex flex-col border-r border-glassBorder shrink-0 hidden md:flex">
                        <div className="p-5 flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-neonBlue to-neonPurple flex items-center justify-center shadow-[0_0_15px_rgba(188,19,254,0.5)]">
                                <i className="fa-solid fa-infinity text-white"></i>
                            </div>
                            <h1 className="text-xl font-bold tracking-wider text-gradient">OmniAI</h1>
                        </div>
                        
                        <div className="px-4 pb-2">
                            <button className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 transition-all text-sm font-semibold flex items-center justify-center gap-2">
                                <i className="fa-solid fa-plus"></i> New Project
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto py-2 space-y-1">
                            <div className="px-4 text-xs font-semibold text-gray-500 mt-2 mb-1 uppercase tracking-wider">Core Tools</div>
                            <SidebarItem icon="fa-comment-dots" text="Center Chat" active={true} />
                            <SidebarItem icon="fa-robot" text="AI Agents" />
                            <SidebarItem icon="fa-image" text="Image Generator" />
                            <SidebarItem icon="fa-microphone" text="Voice Assistant" />
                            
                            <div className="px-4 text-xs font-semibold text-gray-500 mt-6 mb-1 uppercase tracking-wider">Workspace</div>
                            <SidebarItem icon="fa-file-lines" text="Documents" />
                            <SidebarItem icon="fa-pen-nib" text="Canvas" />
                            <SidebarItem icon="fa-code" text="Code Interpreter" />
                            <SidebarItem icon="fa-globe" text="Web Search" />
                            
                            <div className="px-4 text-xs font-semibold text-gray-500 mt-6 mb-1 uppercase tracking-wider">Visual Creativity</div>
                            <SidebarItem icon="fa-wand-magic-sparkles" text="Image Editor" />
                            <SidebarItem icon="fa-video" text="Video Generator" />
                            <SidebarItem icon="fa-cube" text="3D Assets" />
                        </div>

                        <div className="p-4 border-t border-glassBorder space-y-1">
                            <SidebarItem icon="fa-gear" text="Settings" />
                            <SidebarItem icon="fa-key" text="API Keys" />
                            <div className="flex items-center gap-3 px-4 py-2 mt-2">
                                <div className="w-8 h-8 rounded-full bg-gray-600 overflow-hidden">
                                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User" />
                                </div>
                                <div className="text-sm">
                                    <div className="font-semibold text-white">Architect</div>
                                    <div className="text-xs text-neonBlue">Pro Plan</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* CENTER CHAT */}
                    <div className="flex-1 h-full flex flex-col relative z-10">
                        {/* Header */}
                        <div className="h-16 glass-effect border-b border-glassBorder flex items-center justify-between px-6">
                            <div className="flex items-center gap-3 text-sm">
                                <span className="text-gray-400">Current Model:</span>
                                <span className="px-3 py-1 rounded-full bg-neonPurple/20 text-neonPurple border border-neonPurple/30 font-semibold shadow-[0_0_10px_rgba(188,19,254,0.2)]">GPT-5.6 Omni</span>
                            </div>
                            <div className="flex gap-4 text-gray-400">
                                <i className="fa-solid fa-share-nodes hover:text-white cursor-pointer transition-colors"></i>
                                <i className="fa-solid fa-download hover:text-white cursor-pointer transition-colors"></i>
                            </div>
                        </div>

                        {/* Chat History */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex gap-4 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {msg.role === 'assistant' && (
                                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-neonBlue to-neonPurple flex items-center justify-center shrink-0 shadow-lg">
                                            <i className="fa-solid fa-infinity text-white text-xs"></i>
                                        </div>
                                    )}
                                    <div className={`max-w-[70%] p-4 rounded-2xl ${
                                        msg.role === 'user' 
                                            ? 'bg-gradient-to-r from-neonBlue/20 to-neonPurple/20 border border-white/10 text-white rounded-tr-none' 
                                            : 'glass-effect text-gray-100 rounded-tl-none'
                                    }`}>
                                        {msg.text}
                                    </div>
                                    {msg.role === 'user' && (
                                        <div className="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center shrink-0">
                                            <i className="fa-solid fa-user text-white text-xs"></i>
                                        </div>
                                    )}
                                </div>
                            ))}
                            {isTyping && (
                                <div className="flex gap-4 justify-start">
                                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-neonBlue to-neonPurple flex items-center justify-center shrink-0">
                                        <i className="fa-solid fa-infinity text-white text-xs"></i>
                                    </div>
                                    <div className="glass-effect p-4 rounded-2xl rounded-tl-none flex items-center gap-2">
                                        <div className="w-2 h-2 bg-neonBlue rounded-full animate-bounce"></div>
                                        <div className="w-2 h-2 bg-neonPurple rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                                        <div className="w-2 h-2 bg-neonBlue rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Bottom Input Area */}
                        <div className="p-6">
                            <div className="glass-effect rounded-2xl border border-glassBorder p-2 shadow-2xl relative group">
                                <div className="absolute -inset-0.5 bg-gradient-to-r from-neonBlue to-neonPurple rounded-2xl opacity-20 group-hover:opacity-40 blur transition duration-1000 group-hover:duration-200"></div>
                                <div className="relative flex flex-col bg-[#0a0a0a] rounded-xl p-2">
                                    <textarea 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                                        placeholder="Command the OmniAI..." 
                                        className="w-full bg-transparent text-white resize-none outline-none p-3 max-h-32 placeholder-gray-500"
                                        rows="2"
                                    ></textarea>
                                    <div className="flex justify-between items-center mt-2 px-2">
                                        <div className="flex gap-3 text-gray-400">
                                            <i className="fa-solid fa-paperclip hover:text-white cursor-pointer transition"></i>
                                            <i className="fa-solid fa-globe hover:text-neonBlue cursor-pointer transition"></i>
                                            <i className="fa-solid fa-brain hover:text-neonPurple cursor-pointer transition"></i>
                                            <i className="fa-solid fa-code hover:text-green-400 cursor-pointer transition"></i>
                                        </div>
                                        <button 
                                            onClick={handleSend}
                                            className="bg-white text-black px-4 py-1.5 rounded-lg font-bold hover:bg-gray-200 transition-colors shadow-[0_0_15px_rgba(255,255,255,0.3)]"
                                        >
                                            <i className="fa-solid fa-arrow-up"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="text-center text-xs text-gray-600 mt-3">
                                OmniAI can make mistakes. Verify important information.
                            </div>
                        </div>
                    </div>

                    {/* RIGHT CONTROL PANEL */}
                    <div className="w-80 h-full glass-effect z-10 border-l border-glassBorder overflow-y-auto hidden lg:block">
                        <div className="p-5 border-b border-glassBorder">
                            <h2 className="text-sm font-bold uppercase tracking-wider text-gray-400">Control Panel</h2>
                        </div>
                        
                        <div className="p-5 space-y-6">
                            {/* Model Selection */}
                            <div>
                                <label className="text-xs text-gray-500 uppercase font-semibold block mb-2">Primary Model</label>
                                <select className="w-full bg-black/50 border border-white/10 rounded-lg p-2.5 text-sm text-white outline-none focus:border-neonBlue transition">
                                    <option>GPT-5.6 Omni</option>
                                    <option>Claude 3.5 Opus</option>
                                    <option>Gemini 1.5 Pro</option>
                                    <option>Grok 2.0</option>
                                    <option>Local Llama 3</option>
                                </select>
                            </div>

                            <hr className="border-white/5" />

                            {/* Parameters */}
                            <div>
                                <label className="text-xs text-gray-500 uppercase font-semibold block mb-3">Generation Parameters</label>
                                
                                <div className="mb-4">
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="text-gray-300">Temperature</span>
                                        <span className="text-neonBlue">0.7</span>
                                    </div>
                                    <input type="range" min="0" max="100" defaultValue="70" className="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                                </div>

                                <div className="mb-4">
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="text-gray-300">Max Tokens</span>
                                        <span className="text-neonBlue">8192</span>
                                    </div>
                                    <input type="range" min="0" max="100" defaultValue="100" className="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                                </div>
                            </div>

                            <hr className="border-white/5" />

                            {/* Toggles */}
                            <div>
                                <label className="text-xs text-gray-500 uppercase font-semibold block mb-3">Capabilities</label>
                                <ControlToggle label="Web Search Search" />
                                <ControlToggle label="Code Interpreter" />
                                <ControlToggle label="Memory & Context" />
                                <ControlToggle label="Vision Analysis" />
                                <ControlToggle label="Deep Reasoning" />
                            </div>

                            <hr className="border-white/5" />
                            
                            {/* Generation Styles */}
                            <div>
                                <label className="text-xs text-gray-500 uppercase font-semibold block mb-3">Image Generation Style</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <button className="bg-neonBlue/10 border border-neonBlue/30 text-neonBlue text-xs py-2 rounded-lg font-medium">Cyberpunk</button>
                                    <button className="bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300 text-xs py-2 rounded-lg transition">Photoreal</button>
                                    <button className="bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300 text-xs py-2 rounded-lg transition">Anime</button>
                                    <button className="bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300 text-xs py-2 rounded-lg transition">3D Render</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
