<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Custom Styles -->
    <style>
        /* Markdown Styling */
        .markdown-body {
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .markdown-body p { margin-bottom: 0.75em; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre {
            background-color: #1f2937; /* gray-800 */
            color: #e5e7eb; /* gray-200 */
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: rgba(128, 128, 128, 0.2);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body h1 { font-size: 1.5rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        
        /* Cursor Animation */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-start infinite;
            color: #3b82f6;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        
        /* Loader Overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 1.25rem;
            color: #111827;
            transition: opacity 0.3s;
        }
        .dark #loading { background: #111827; color: #f9fafb; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Hide elements dynamically */
        .hidden { display: none !important; }
        
        /* Auto-resizing textarea limits */
        textarea { resize: none; max-height: 200px; }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-200 antialiased">

    <!-- Loading Fallback -->
    <div id="loading">
        <div class="spinner"></div>
        <span>Loading App...</span>
    </div>

    <!-- App Layout Container -->
    <div class="flex flex-col md:flex-row min-h-[100dvh]">
        
        <!-- Sidebar Backdrop (Mobile) -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-72 bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col h-[100dvh]">
            
            <!-- Sidebar Header -->
            <div class="p-4 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg transition-colors font-medium">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
                <button class="md:hidden ml-3 p-2 text-gray-500" onclick="toggleSidebar()">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="px-4 pb-2">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search chats..." class="w-full bg-gray-200 dark:bg-gray-900 border border-transparent focus:border-blue-500 rounded-lg pl-9 pr-3 py-2 text-sm text-gray-800 dark:text-gray-200 outline-none" oninput="renderSidebar()">
                </div>
            </div>

            <!-- Chat List -->
            <div id="chat-list" class="flex-1 overflow-y-auto px-2 space-y-1 pb-4">
                <!-- Dynamically populated -->
            </div>
            
            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <button onclick="toggleSettings()" class="flex items-center gap-2 text-sm font-medium hover:text-blue-500 transition-colors">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 h-[100dvh]">
            
            <!-- Mobile Header -->
            <header class="md:hidden flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 z-10 sticky top-0">
                <button onclick="toggleSidebar()" class="p-2 -ml-2 text-gray-600 dark:text-gray-300">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="font-semibold text-lg truncate px-4" id="mobile-title">New Chat</h1>
                <button onclick="createNewChat()" class="p-2 -mr-2 text-gray-600 dark:text-gray-300">
                    <i class="fa-regular fa-pen-to-square text-xl"></i>
                </button>
            </header>

            <!-- Chat Area -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 lg:px-12 flex flex-col gap-6">
                <!-- Messages populated here -->
                
                <!-- Empty State -->
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center px-4 hidden">
                    <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center text-3xl mb-4">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">How can I help you today?</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">Enter a prompt below to start a conversation using your configured OpenRouter model.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 md:p-6 lg:px-12 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md sticky bottom-0 border-t md:border-none border-gray-200 dark:border-gray-700">
                <form id="chat-form" class="relative flex items-end gap-2 max-w-4xl mx-auto border border-gray-300 dark:border-gray-600 rounded-2xl bg-white dark:bg-gray-800 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent p-2 shadow-sm transition-shadow">
                    <textarea 
                        id="message-input" 
                        rows="1"
                        class="w-full bg-transparent text-gray-800 dark:text-gray-100 placeholder-gray-500 outline-none py-3 px-3 max-h-[200px] overflow-y-auto"
                        placeholder="Message AI..."
                        oninput="resizeTextarea(this)"
                        onkeydown="handleEnter(event)"
                    ></textarea>
                    <button type="submit" id="send-button" class="p-3 text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed mb-1 mr-1">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500">
                    AI can make mistakes. Consider verifying important information.
                </div>
            </div>
            
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-200" id="settings-content">
            <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Settings</h3>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-5">
                
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="setting-api-key" placeholder="sk-or-v1-..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow text-gray-900 dark:text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="setting-model" placeholder="deepseek/deepseek-r1:free" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow text-gray-900 dark:text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt (Global)</label>
                    <textarea id="setting-system-prompt" rows="3" placeholder="You are a helpful AI assistant..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow text-gray-900 dark:text-white resize-y"></textarea>
                </div>

            </div>
            <div class="p-5 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3 bg-gray-50 dark:bg-gray-800/50">
                <button onclick="toggleSettings()" class="px-4 py-2 rounded-lg font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Save Details</button>
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        // State Management
        const state = {
            apiKey: '',
            model: 'deepseek/deepseek-r1:free',
            systemPrompt: 'You are a helpful, expert AI assistant.',
            darkMode: false,
            chats: [],
            currentChatId: null,
            isGenerating: false
        };

        // DOM Elements
        const DOM = {
            loading: document.getElementById('loading'),
            sidebar: document.getElementById('sidebar'),
            sidebarBackdrop: document.getElementById('sidebar-backdrop'),
            chatList: document.getElementById('chat-list'),
            chatContainer: document.getElementById('chat-container'),
            emptyState: document.getElementById('empty-state'),
            chatForm: document.getElementById('chat-form'),
            messageInput: document.getElementById('message-input'),
            sendButton: document.getElementById('send-button'),
            searchInput: document.getElementById('search-input'),
            mobileTitle: document.getElementById('mobile-title'),
            themeIcon: document.getElementById('theme-icon'),
            
            // Settings Modal
            settingsModal: document.getElementById('settings-modal'),
            settingsContent: document.getElementById('settings-content'),
            settingApiKey: document.getElementById('setting-api-key'),
            settingModel: document.getElementById('setting-model'),
            settingSystemPrompt: document.getElementById('setting-system-prompt')
        };

        // Initialization
        function init() {
            try {
                loadState();
                applyTheme();
                
                if (state.chats.length === 0) {
                    createNewChat();
                } else if (!state.currentChatId) {
                    state.currentChatId = state.chats[0].id;
                }

                renderSidebar();
                renderChat();
                
                // Form event
                DOM.chatForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    sendMessage();
                });

                // Remove loader securely
                setTimeout(() => {
                    DOM.loading.style.opacity = '0';
                    setTimeout(() => DOM.loading.classList.add('hidden'), 300);
                }, 100);

            } catch (err) {
                console.error("Initialization Error: ", err);
                alert("Failed to initialize the app. Check console.");
            }
        }

        // State Persistence
        function loadState() {
            const saved = localStorage.getItem('universalAiState');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.apiKey = parsed.apiKey || '';
                    state.model = parsed.model || 'deepseek/deepseek-r1:free';
                    state.systemPrompt = parsed.systemPrompt || 'You are a helpful, expert AI assistant.';
                    state.darkMode = parsed.darkMode === true;
                    state.chats = Array.isArray(parsed.chats) ? parsed.chats : [];
                    state.currentChatId = parsed.currentChatId || null;
                } catch (e) {
                    console.error("State parse error", e);
                }
            } else {
                // Check OS dark mode preference
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    state.darkMode = true;
                }
            }
        }

        function saveState() {
            localStorage.setItem('universalAiState', JSON.stringify({
                apiKey: state.apiKey,
                model: state.model,
                systemPrompt: state.systemPrompt,
                darkMode: state.darkMode,
                chats: state.chats,
                currentChatId: state.currentChatId
            }));
        }

        // Theme Toggle
        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
                DOM.themeIcon.classList.remove('fa-moon');
                DOM.themeIcon.classList.add('fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                DOM.themeIcon.classList.remove('fa-sun');
                DOM.themeIcon.classList.add('fa-moon');
            }
        }

        // Sidebar Toggle (Mobile)
        function toggleSidebar() {
            const isClosed = DOM.sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                DOM.sidebar.classList.remove('-translate-x-full');
                DOM.sidebarBackdrop.classList.remove('hidden');
            } else {
                DOM.sidebar.classList.add('-translate-x-full');
                DOM.sidebarBackdrop.classList.add('hidden');
            }
        }

        // Settings Modal
        function toggleSettings() {
            const isHidden = DOM.settingsModal.classList.contains('hidden');
            if (isHidden) {
                DOM.settingApiKey.value = state.apiKey || '';
                DOM.settingModel.value = state.model || '';
                DOM.settingSystemPrompt.value = state.systemPrompt || '';
                DOM.settingsModal.classList.remove('hidden');
                setTimeout(() => DOM.settingsContent.classList.remove('scale-95'), 10);
            } else {
                DOM.settingsContent.classList.add('scale-95');
                setTimeout(() => DOM.settingsModal.classList.add('hidden'), 200);
            }
        }

        function saveSettings() {
            state.apiKey = DOM.settingApiKey.value.trim();
            state.model = DOM.settingModel.value.trim() || 'deepseek/deepseek-r1:free';
            state.systemPrompt = DOM.settingSystemPrompt.value.trim();
            saveState();
            toggleSettings();
            
            if(!state.apiKey) {
                alert("Please add an OpenRouter API key to chat.");
            }
        }

        // Chat Management
        function generateId() {
            return Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        }

        function createNewChat() {
            const newChat = {
                id: generateId(),
                title: 'New Conversation',
                messages: [],
                pinned: false,
                project: '',
                updatedAt: Date.now()
            };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveState();
            renderSidebar();
            renderChat();
            if (window.innerWidth < 768) toggleSidebar();
            DOM.messageInput.focus();
        }

        function selectChat(id) {
            if (state.isGenerating) return;
            state.currentChatId = id;
            saveState();
            renderSidebar();
            renderChat();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (confirm("Delete this chat?")) {
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.currentChatId === id) {
                    state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
                    if (!state.currentChatId) createNewChat();
                }
                saveState();
                renderSidebar();
                renderChat();
            }
        }

        function togglePin(e, id) {
            e.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (chat) {
                chat.pinned = !chat.pinned;
                saveState();
                renderSidebar();
            }
        }

        function renameChat(e, id) {
            e.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (chat) {
                const newTitle = prompt("Enter new title:", chat.title);
                if (newTitle !== null && newTitle.trim() !== '') {
                    chat.title = newTitle.trim();
                    saveState();
                    renderSidebar();
                    if(state.currentChatId === id) DOM.mobileTitle.innerText = chat.title;
                }
            }
        }
        
        function setProject(e, id) {
            e.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (chat) {
                const newProject = prompt("Assign to project / library (leave blank to remove):", chat.project || '');
                if (newProject !== null) {
                    chat.project = newProject.trim();
                    saveState();
                    renderSidebar();
                }
            }
        }

        // UI Rendering
        function renderSidebar() {
            const query = DOM.searchInput.value.toLowerCase();
            DOM.chatList.innerHTML = '';

            let filteredChats = state.chats.filter(c => 
                c.title.toLowerCase().includes(query) || 
                (c.project && c.project.toLowerCase().includes(query)) ||
                c.messages.some(m => m.content.toLowerCase().includes(query))
            );

            // Sort: pinned first, then by updatedAt desc
            filteredChats.sort((a, b) => {
                if (a.pinned === b.pinned) return b.updatedAt - a.updatedAt;
                return a.pinned ? -1 : 1;
            });

            if (filteredChats.length === 0) {
                DOM.chatList.innerHTML = `<div class="p-4 text-sm text-gray-500 text-center">No chats found.</div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${
                    isActive ? 'bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white font-medium' : 'hover:bg-gray-200/50 dark:hover:bg-gray-700/50 text-gray-700 dark:text-gray-300'
                }`;
                div.onclick = () => selectChat(chat.id);

                let projectBadge = chat.project 
                    ? `<span class="inline-block text-[10px] bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300 px-1.5 py-0.5 rounded ml-2 align-middle truncate max-w-[60px]">${chat.project}</span>` 
                    : '';

                div.innerHTML = `
                    <div class="flex-1 min-w-0 flex items-center">
                        <i class="fa-solid fa-message text-sm opacity-60 mr-3"></i>
                        <span class="truncate block text-sm">${chat.title} ${projectBadge}</span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 ${isActive ? 'opacity-100' : ''}">
                        <button class="p-1 hover:text-blue-500 transition-colors" title="${chat.pinned ? 'Unpin' : 'Pin'}" onclick="togglePin(event, '${chat.id}')">
                            <i class="fa-solid fa-thumbtack ${chat.pinned ? 'text-blue-500 transform rotate-45' : 'text-gray-400'} text-xs"></i>
                        </button>
                        <div class="relative group/menu">
                            <button class="p-1 hover:text-blue-500 text-gray-400 transition-colors" title="Options" onclick="event.stopPropagation()">
                                <i class="fa-solid fa-ellipsis-vertical text-xs px-1"></i>
                            </button>
                            <!-- Dropdown -->
                            <div class="absolute right-0 top-full mt-1 w-32 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 hidden group-hover/menu:block z-50 overflow-hidden">
                                <button class="w-full text-left px-3 py-2 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2" onclick="renameChat(event, '${chat.id}')"><i class="fa-solid fa-pen fa-fw"></i> Rename</button>
                                <button class="w-full text-left px-3 py-2 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2" onclick="setProject(event, '${chat.id}')"><i class="fa-solid fa-folder fa-fw"></i> Project</button>
                                <button class="w-full text-left px-3 py-2 text-xs text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 flex items-center gap-2" onclick="deleteChat(event, '${chat.id}')"><i class="fa-solid fa-trash fa-fw"></i> Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                DOM.chatList.appendChild(div);
            });
        }

        function renderChat() {
            DOM.chatContainer.innerHTML = '';
            const chat = state.chats.find(c => c.id === state.currentChatId);
            
            if (!chat) return;

            DOM.mobileTitle.innerText = chat.title;

            if (chat.messages.length === 0) {
                DOM.emptyState.classList.remove('hidden');
                DOM.chatContainer.appendChild(DOM.emptyState);
                return;
            }

            DOM.emptyState.classList.add('hidden');
            
            chat.messages.forEach(msg => {
                appendMessageToUI(msg.role, msg.content, false);
            });
            scrollToBottom();
        }

        function appendMessageToUI(role, content, isStreaming = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-4 max-w-4xl mx-auto w-full ${role === 'user' ? 'flex-row-reverse' : 'flex-row'}`;
            
            const avatarWrapper = document.createElement('div');
            avatarWrapper.className = `flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm mt-1 shadow-sm ${
                role === 'user' 
                ? 'bg-blue-600 text-white' 
                : 'bg-gradient-to-br from-emerald-400 to-teal-600 text-white'
            }`;
            avatarWrapper.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const contentWrapper = document.createElement('div');
            // User bubbles vs AI text block (ChatGPT style)
            contentWrapper.className = role === 'user' 
                ? 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] whitespace-pre-wrap shadow-sm'
                : 'w-full max-w-[85%] min-w-0 pt-1 text-gray-800 dark:text-gray-200';
            
            if (role === 'user') {
                contentWrapper.textContent = content;
            } else {
                const markdownBody = document.createElement('div');
                markdownBody.className = `markdown-body ${isStreaming ? 'typing-cursor' : ''}`;
                // Render markdown
                markdownBody.innerHTML = marked.parse(content || '');
                contentWrapper.appendChild(markdownBody);
            }

            msgDiv.appendChild(avatarWrapper);
            msgDiv.appendChild(contentWrapper);
            
            DOM.chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        // Interaction Handlers
        function resizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;
        }

        // API & Streaming Logic
        async function sendMessage() {
            if (state.isGenerating) return;
            
            const text = DOM.messageInput.value.trim();
            if (!text) return;

            if (!state.apiKey) {
                alert("Please configure your OpenRouter API Key in Settings first.");
                toggleSettings();
                return;
            }

            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) return;

            // Generate title based on first message
            if (chat.messages.length === 0) {
                chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            // User message
            chat.messages.push({ role: 'user', content: text });
            chat.updatedAt = Date.now();
            DOM.messageInput.value = '';
            DOM.messageInput.style.height = 'auto';
            DOM.emptyState.classList.add('hidden');
            
            appendMessageToUI('user', text, false);
            renderSidebar(); 
            saveState();

            // Prepare AI Request
            state.isGenerating = true;
            DOM.sendButton.disabled = true;
            DOM.sendButton.innerHTML = '<i class="fa-solid fa-stop"></i>';

            // Create placeholder for AI response
            const aiMessageObj = { role: 'assistant', content: '' };
            chat.messages.push(aiMessageObj);
            const aiDomElement = appendMessageToUI('assistant', '', true);
            const markdownContainer = aiDomElement.querySelector('.markdown-body');

            const apiMessages = [
                { role: 'system', content: state.systemPrompt },
                ...chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Universal AI Chat'
                    },
                    body: JSON.stringify({
                        model: state.model,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API Error ${response.status}: ${errText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;
                let streamBuffer = '';

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        streamBuffer += decoder.decode(value, { stream: true });
                        const lines = streamBuffer.split('\n');
                        streamBuffer = lines.pop(); // keep incomplete line

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith('data: ')) {
                                const dataStr = trimmed.slice(6);
                                if (dataStr === '[DONE]') continue;
                                
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    const delta = parsed.choices?.[0]?.delta?.content;
                                    if (delta) {
                                        aiMessageObj.content += delta;
                                        // Throttle re-rendering slightly for performance, or update direct
                                        markdownContainer.innerHTML = marked.parse(aiMessageObj.content);
                                        scrollToBottom();
                                    }
                                } catch (e) {
                                    console.warn("Parse error on streaming chunk", e, dataStr);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error(error);
                aiMessageObj.content += `\n\n**Error:** ${error.message || 'Connection failed.'}`;
                markdownContainer.innerHTML = marked.parse(aiMessageObj.content);
            } finally {
                state.isGenerating = false;
                DOM.sendButton.disabled = false;
                DOM.sendButton.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                markdownContainer.classList.remove('typing-cursor'); // Remove cursor
                chat.updatedAt = Date.now();
                saveState();
                renderSidebar(); // Update timestamps
            }
        }

        // Initialize App on DOM Load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
